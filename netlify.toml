# --- SECURITY HEADERS ---
# Header HTTP a basso rischio (nessun impatto su script inline, GTM/Partytown, JSON-LD).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # CSP in modalità Report-Only: osserva le violazioni senza bloccare nulla.
    # Domini mappati direttamente dal codice sorgente: GTM (script/iframe),
    # Google Analytics (beacon via connect-src), Partytown (worker-src blob:
    # per eseguire GTM fuori dal thread principale). Nessun font/CDN esterno.
    # Passare a "Content-Security-Policy" (enforcement) solo dopo un periodo
    # di osservazione delle violazioni in produzione.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; worker-src 'self' blob:; connect-src 'self' https://www.googletagmanager.com https://*.google-analytics.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-src 'self' https://www.googletagmanager.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';"

# --- BLOCCO INDICIZZAZIONE CV (contiene dati personali: telefono, indirizzo, data di nascita) ---
# X-Robots-Tag (non robots.txt): permette a Google di ri-scansionare il file,
# leggere la direttiva noindex e rimuoverlo dall'indice. Un disallow in
# robots.txt impedirebbe invece la scansione e lascerebbe la pagina già
# indicizzata bloccata lì per sempre.
[[headers]]
  for = "/CV/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# --- CORS + CACHE PER L'ENDPOINT GEO/RAG ---
# Astro scarta gli header custom del Response quando l'endpoint è prerenderizzato
# (output statico): vanno quindi dichiarati qui, a livello CDN.
[[headers]]
  for = "/llms-full.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=86400"
