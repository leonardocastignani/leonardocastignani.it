name: Notifica motori di ricerca dopo il deploy

# Si attiva sullo stesso push su "main" che fa partire il deploy di Netlify.
# Aspetta che quel deploy risulti "ready" sul sito live, poi notifica:
#  - Bing / Yandex / Seznam / Naver via IndexNow (protocollo condiviso)
#  - Google tramite la Search Console API (resubmit della sitemap)
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: notify-search-engines
  cancel-in-progress: true

env:
  SITE_URL: https://www.leonardocastignani.it

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Aspetta che il deploy Netlify sia live
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          echo "In attesa del deploy Netlify per il commit $SHA..."

          for i in $(seq 1 40); do
            DEPLOYS_JSON=$(curl -sS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys?per_page=10")

            STATE=$(echo "$DEPLOYS_JSON" | jq -r --arg sha "$SHA" \
              '[.[] | select(.commit_ref == $sha)][0].state // empty')

            if [ "$STATE" = "ready" ]; then
              echo "Deploy live (ready)."
              exit 0
            fi

            if [ "$STATE" = "error" ]; then
              echo "::error::Il deploy Netlify per questo commit e' fallito (state=error). Salto la notifica ai motori di ricerca."
              exit 1
            fi

            echo "Tentativo $i/40 - stato attuale: ${STATE:-non ancora creato}. Riprovo tra 15s..."
            sleep 15
          done

          echo "::error::Timeout: nessun deploy 'ready' trovato per $SHA entro 10 minuti."
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - name: Notifica Bing / Yandex / Seznam / Naver (IndexNow)
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/seo/indexnow-submit.mjs

      - name: Notifica Google (Search Console - resubmit sitemap)
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_PROPERTY: ${{ secrets.GSC_PROPERTY }}
        run: node scripts/seo/gsc-resubmit-sitemap.mjs
